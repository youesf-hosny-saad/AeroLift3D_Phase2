[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aerolift3d"
version = "0.2.0"
description = "Educational parametric 3D trainer-aircraft model with preliminary lift analysis (PySide6 + PyVista)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Youssef Hosny Saad" }]
keywords = ["aerodynamics", "aerospace", "pyside6", "pyvista", "education", "3d"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Education",
]
dependencies = [
    "PySide6>=6.7",
    "pyvista>=0.44",
    "pyvistaqt>=0.11",
    "numpy>=2.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["psutil>=5.9"]

[project.gui-scripts]
aerolift3d = "aerolift.app:main"

[tool.setuptools.packages.find]
include = ["aerolift*"]
